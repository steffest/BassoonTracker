<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BassoonTracker v2 — app.yaml preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 12px monospace; }
  #app { position: absolute; inset: 0; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="status">Loading…</div>
<div id="app"></div>
<script type="module">
  // Spec 005 Phase 1 preview: renders the *compiled* project/specs/
  // application/current/app.yaml graph (project/specs/application/
  // app-outline.json, produced by `node v2/compiler/generate.js`), not the
  // spec-003 transport/instrument-list example (that stays at preview.html
  // + outline.json, untouched by this file). No workbench/editor code is
  // loaded here.
  import { mountGenericRenderer } from "./renderers/canvas/mountGeneric.js";

  const statusEl = document.getElementById("status");
  const appEl = document.getElementById("app");

  async function main() {
    const response = await fetch("./project/specs/application/app-outline.json");
    if (!response.ok) {
      throw new Error(`failed to load app-outline.json (${response.status}). Run: node v2/compiler/generate.js`);
    }
    const outline = await response.json();
    await mountGenericRenderer(appEl, outline);
    statusEl.remove();
  }

  main().catch(error => {
    console.error(error);
    statusEl.textContent = "Failed to load preview:\n" + error.message;
  });
</script>
</body>
</html>
