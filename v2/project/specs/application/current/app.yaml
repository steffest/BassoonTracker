app:
  rules: noDependencies
  skin: default
  ui:
    main:
      type: panel
      variant: appRoot
      layout:
        padding: 0
        gap: 0
      content:
        - top:
            type: panel
            variant: mainStrip
            layout:
              width: fill
              height: 32
              padding: 0
            stripContent:
              type: panel
              variant: transparent
              layout:
                position: absolute
                left: columnMargin
                top: 0
                width: col5
                widthOffset: 4
                height: 32
                direction: row
                padding: 0
                gap: 0
              menu area:
                type: panel
                variant: transparent
                layout:
                  width: fill
                  height: 26
                  direction: row
                  padding: 0
                  gap: 4
                menu bar:
                  type: panel
                  variant: menuBar
                  layout:
                    width: col2
                    height: 26
                    padding: 0
                  menu:
                    type: menu
                    layout:
                      position: viewport
                      left: 5
                      top: 0
                      width: 250
                      height: 26
                      padding: 0
                      gap: 0
                    items:
                      - label: File
                        type: submenu
                        items:
                          - type: label
                            variant: menuItem
                            label: New
                            actions:
                              - click: newFile
                          - type: label
                            variant: menuItem
                            label: Load File
                            actions:
                              - click: openFile
                          - type: label
                            variant: menuItem
                            label: Save File
                            actions:
                              - click: saveFile
                          - type: label
                            variant: menuItem
                            label: Open Random MOD Song
                            actions:
                              - click: randomSong
                          - type: label
                            variant: menuItem
                            label: Open Random XM Song
                            actions:
                              - click: randomSongXM
                          - type: label
                            variant: menuItem
                            label: Open Random Playlist
                            actions:
                              - click: randomPlayList
                      - label: Edit
                        type: submenu
                        items:
                          - type: label
                            variant: menuItem
                            label: Undo
                            actions:
                              - click: undo
                          - type: label
                            variant: menuItem
                            label: Redo
                            actions:
                              - click: redo
                          - type: label
                            variant: menuItem
                            label: Cut
                            actions:
                              - click: cut
                          - type: label
                            variant: menuItem
                            label: Copy
                            actions:
                              - click: copy
                          - label: Clear
                            type: submenu
                            items:
                              - type: label
                                variant: menuItem
                                label: Clear Track
                                actions:
                                  - click: clearTrack
                              - type: label
                                variant: menuItem
                                label: Clear Pattern
                                actions:
                                  - click: clearPattern
                              - type: label
                                variant: menuItem
                                label: Clear Song
                                actions:
                                  - click: clearSong
                              - type: label
                                variant: menuItem
                                label: Clear Instruments
                                actions:
                                  - click: clearInstruments
                          - type: label
                            variant: menuItem
                            label: Paste
                            actions:
                              - click: paste
                          - type: label
                            variant: menuItem
                            label: Render Pattern 2 Sample
                            actions:
                              - click: pattern2Sample
                      - label: View
                        type: submenu
                        items:
                          - type: label
                            variant: menuItem
                            label: Main
                            actions:
                              - click: showMain
                          - type: label
                            variant: menuItem
                            label: Options
                            actions:
                              - click: showOptions
                          - type: label
                            variant: menuItem
                            label: File Operations
                            actions:
                              - click: showFileOperations
                          - type: label
                            variant: menuItem
                            label: Sample Editor
                            actions:
                              - click: showSampleEditor
                          - type: label
                            variant: menuItem
                            label: Piano
                            actions:
                              - click: togglePiano
                          - type: label
                            variant: menuItem
                            label: Nibbles
                            actions:
                              - click: openNibbles
                          - type: label
                            variant: menuItem
                            label: Performance stats
                            actions:
                              - click: showStats
                      - label: Help
                        type: submenu
                        items:
                          - type: label
                            variant: menuItem
                            label: About
                            actions:
                              - click: showAbout
                          - type: label
                            variant: menuItem
                            label: Documentation
                            actions:
                              - click: showHelp
                          - type: label
                            variant: menuItem
                            label: Sourcecode on Github
                            actions:
                              - click: showGithub
                volume meter: volumemeter
              notifications:
                type: panel
                variant: transparent
                layout:
                  width: 50
                  height: 32
                  padding: 0
                  collapseEmpty: true
                content:
                - type: notificationLight
                  label: Key
                  signal: keyPreview
                  layout:
                    position: viewport
                    right: 7
                    top: 4
                    width: 49
                    height: 13
                  visibleWhen:
                    field: show-key-input.active
                    oneOf:
                      - "true"
                - type: notificationLight
                  variant: midi
                  label: Midi
                  signal: midiIn
                  layout:
                    position: viewport
                    right: 7
                    top: 16
                    width: 49
                    height: 13
                  visibleWhen:
                    field: show-midi-input.active
                    oneOf:
                      - "true"
        - songProperties
        - controlBar
        - name: normalMainView
          type: panel
          variant: mainStrip
          layout:
            width: fill
            height: fill
            direction: column
            padding: 0
            gap: 0
          content:
            - name: patternSection
              type: panel
              variant: transparent
              layout:
                position: absolute
                left: columnMargin
                top: 0
                width: col5
                height: fill
                direction: row
                padding: 0
                gap: 4
              content:
                - name: patternLeftColumn
                  type: panel
                  variant: transparent
                  layout:
                    width: col1
                    height: fill
                    direction: column
                    padding: 0
                    gap: 0
                  content:
                    - editPad
                    - patternSidebar
                - name: patternSectionDefault
                  type: panel
                  layout:
                    width: fill
                    height: fill
                    direction: column
                  visibleWhen:
                    field: pattern-section-view.value
                    oneOf:
                      - ""
                  content:
                    - infoBar
                    - patternViewPanel
                - sampleEditPanel
        - pianoPanel
