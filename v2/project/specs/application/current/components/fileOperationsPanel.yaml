name: fileOperationsPanel
type: panel
variant: mainStripLayered
layout:
  position: absolute
  left: 0
  top: 0
  width: fill
  height: fill
visibleWhen:
  field: song-properties-view.value
  oneOf:
    - File Operations
content:
  - name: diskOperationsGrid
    type: panel
    variant: transparent
    layout:
      position: absolute
      left: 0
      top: 0
      width: fill
      height: fill
    content:
      - name: actionColumn
        type: panel
        variant: diskSelector
        layout:
          position: absolute
          left: columnMargin
          top: 5
          width: col1
          height: 150
        content:
          - name: captionBox
            type: panel
            variant: diskSelectorCaption
            layout:
              position: absolute
              left: 1
              right: 1
              top: 1
              height: 16
          - type: label
            label: Action
            variant: diskSelectorCaption
            layout:
              position: absolute
              left: -1
              right: 3
              top: 3
              height: 16
          - name: actionGroup
            type: radioGroup
            variant: diskSelector
            layout:
              position: absolute
              left: 4
              right: 2
              top: 18
              height: 70
              direction: column
              padding: 0
              gap: 0
              distribute: floor
            items:
              - name: Load
                label: Load
                variant: diskSelector
                layout:
                  height: fill
                rule: highlighted when disk-action.value is "Load"
              - name: Save
                label: Save
                variant: diskSelectorDivider
                layout:
                  height: fill
                rule: highlighted when disk-action.value is "Save"
            actions:
              - change: setDiskAction
      - name: typeColumn
        type: panel
        variant: diskSelector
        layout:
          position: absolute
          left: col2Left
          top: 5
          width: col1
          height: 150
        content:
          - name: captionBox
            type: panel
            variant: diskSelectorCaption
            layout:
              position: absolute
              left: 1
              right: 1
              top: 1
              height: 16
          - type: label
            label: Type
            variant: diskSelectorCaption
            layout:
              position: absolute
              left: -1
              right: 3
              top: 3
              height: 16
          - name: typeGroup
            type: radioGroup
            variant: diskSelector
            layout:
              position: absolute
              left: 4
              right: 2
              top: 18
              height: 130
              direction: column
              padding: 0
              gap: 0
              distribute: floor
            items:
              - name: Module
                label: Module
                variant: diskSelector
                layout:
                  height: fill
                rule: highlighted when disk-type.value is "Module"
              - name: Sample
                label: Sample
                variant: diskSelectorDivider
                layout:
                  height: fill
                rule: highlighted when disk-type.value is "Sample"
              - name: Playlist
                label: Playlist
                variant: diskSelectorDivider
                layout:
                  height: fill
                rule: highlighted when disk-type.value is "Playlist"
            actions:
              - change: setDiskType
      - name: targetColumn
        type: panel
        variant: diskSelector
        layout:
          position: absolute
          left: col3Left
          top: 5
          width: col1
          height: 150
        content:
          - name: captionBox
            type: panel
            variant: diskSelectorCaptionTarget
            layout:
              position: absolute
              left: 2
              right: 1
              top: 1
              height: 16
          - name: fromLabel
            type: label
            label: From
            variant: diskSelectorCaption
            layout:
              position: absolute
              left: -1
              right: 4
              top: 3
              height: 16
            visibleWhen:
              field: disk-action.value
              oneOf:
                - ""
                - Load
          - name: toLabel
            type: label
            label: To
            variant: diskSelectorCaption
            layout:
              position: absolute
              left: -1
              right: 4
              top: 3
              height: 16
            visibleWhen:
              field: disk-action.value
              oneOf:
                - Save
          - name: loadTargets
            type: panel
            variant: transparent
            layout:
              position: absolute
              left: 0
              top: 0
              width: fill
              height: fill
            visibleWhen:
              field: disk-action.value
              oneOf:
                - ""
                - Load
            content:
              - name: moduleTargets
                type: radioGroup
                variant: diskSelector
                layout:
                  position: absolute
                  left: 2
                  right: 1
                  top: 18
                  height: 130
                  direction: column
                  padding: 0
                  gap: 0
                  distribute: floor
                visibleWhen:
                  field: disk-type.value
                  oneOf:
                    - ""
                    - Module
                items:
                  - name: Bassoon
                    label: "Bassoon:"
                    variant: diskSelector
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "Bassoon"
                  - name: ModArchive
                    label: "ModArchive:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "ModArchive"
                  - name: Modules.pl
                    label: "Modules.pl:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "Modules.pl"
                  - name: Dropbox
                    label: "Dropbox:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "Dropbox"
                  - name: local
                    label: "local:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "local"
                actions:
                  - change: setDiskTarget
              - name: sampleTargets
                type: radioGroup
                variant: diskSelector
                layout:
                  position: absolute
                  left: 2
                  right: 1
                  top: 18
                  height: 130
                  direction: column
                  padding: 0
                  gap: 0
                  distribute: floor
                visibleWhen:
                  field: disk-type.value
                  oneOf:
                    - Sample
                items:
                  - name: Bassoon
                    label: "Bassoon:"
                    variant: diskSelector
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "Bassoon"
                  - name: Dropbox
                    label: "Dropbox:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "Dropbox"
                  - name: local
                    label: "local:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "local"
                actions:
                  - change: setDiskTarget
              - name: playlistTargets
                type: radioGroup
                variant: diskSelector
                layout:
                  position: absolute
                  left: 2
                  right: 1
                  top: 18
                  height: 130
                  direction: column
                  padding: 0
                  gap: 0
                  distribute: floor
                visibleWhen:
                  field: disk-type.value
                  oneOf:
                    - Playlist
                items:
                  - name: Bassoon
                    label: "Bassoon:"
                    variant: diskSelector
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "Bassoon"
                  - name: HippoPlayer.se
                    label: "HippoPlayer.se:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "HippoPlayer.se"
                  - name: Dropbox
                    label: "Dropbox:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "Dropbox"
                  - name: local
                    label: "local:"
                    variant: diskSelectorDivider
                    layout:
                      height: fill
                    rule: highlighted when disk-target.value is "local"
                actions:
                  - change: setDiskTarget
          - name: saveTargets
            type: radioGroup
            variant: diskSelector
            layout:
              position: absolute
              left: 2
              right: 1
              top: 18
              height: 130
              direction: column
              padding: 0
              gap: 0
              distribute: floor
            visibleWhen:
              field: disk-action.value
              oneOf:
                - Save
            items:
              - name: local
                label: "local:"
                variant: diskSelector
                layout:
                  height: fill
                rule: highlighted when disk-target.value is "local"
              - name: Dropbox
                label: "Dropbox:"
                variant: diskSelectorDivider
                layout:
                  height: fill
                rule: highlighted when disk-target.value is "Dropbox"
            actions:
              - change: setDiskTarget
      - name: contentColumn
        type: panel
        variant: transparent
        layout:
          position: absolute
          left: col4Left
          top: 5
          width: col2Exact
          height: 150
          direction: column
          padding: 0
          gap: 0
        content:
          - name: loadContent
            type: panel
            layout:
              width: fill
              height: fill
              direction: column
            visibleWhen:
              field: disk-action.value
              oneOf:
                - ""
                - Load
            content:
              - type: label
                label: "Load module:"
              - name: browser
                type: fileBrowser
                layout:
                  width: fill
                  height: fill
                actions:
                  - change: setBrowserRow
          - name: saveContent
            type: panel
            layout:
              width: fill
              height: fill
              direction: column
            visibleWhen:
              field: disk-action.value
              oneOf:
                - Save
            content:
              - name: saveModulePanel
                type: panel
                visibleWhen:
                  field: save-type.value
                  oneOf:
                    - ""
                    - Module
                content:
                  - type: button
                    label: "Export Module"
                    actions:
                      - click: saveFile
              - name: saveSamplePanel
                type: panel
                layout:
                  direction: column
                visibleWhen:
                  field: save-type.value
                  oneOf:
                    - Sample
                content:
                  - type: radioGroup
                    variant: buttons
                    items:
                      - label: "WAV 8-bit"
                      - label: "WAV 16-bit"
                      - label: "RAW 8-bit"
                      - label: XI
                    actions:
                      - change: setSampleFormat
                  - type: button
                    label: "Export Sample"
                    actions:
                      - click: exportSample
              - name: savePlaylistPanel
                type: panel
                layout:
                  direction: column
                visibleWhen:
                  field: save-type.value
                  oneOf:
                    - Playlist
                content:
                  - type: radioGroup
                    variant: buttons
                    items:
                      - label: PLS
                      - label: M3U
                      - label: JSON
                    actions:
                      - change: setPlaylistFormat
                  - type: button
                    label: "Export Playlist"
                    actions:
                      - click: exportPlayList
