name: patternViewPanel
type: panel
layout:
  width: fill
  height: fill
  direction: column
content:
  - name: scopes
    type: scopesView
    variant: default
    layout:
      width: fill
      height: 66
      offsetY: -21
      horizontalFrame: patternTracks
  - name: patternGridPanel
    type: panel
    layout:
      width: fill
      height: fill
    visibleWhen:
      field: pattern-view.value
      oneOf:
        - ""
        - "Column view"
    content:
      - name: trackControl
        type: trackControl
        layout:
          width: fill
          height: 32
      - name: patternGrid
        type: patternGrid
        layout:
          width: fill
          height: fill
  - name: multitrackViewPanel
    type: panel
    layout:
      width: fill
      height: fill
    visibleWhen:
      field: pattern-view.value
      oneOf:
        - "Row view"
    content:
      - name: multitrackView
        type: multitrackView
        layout:
          width: fill
          height: fill
