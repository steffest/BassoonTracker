name: songProperties
type: panel
variant: mainStripLayered
layout:
  width: fill
  height: 160
  direction: column
  resizable: horizontal
content:
  - name: songPropertiesDefault
    type: viewport
    variant: transparent
    # Spec 071: v1's own appMainPanel.js never stacks all of this content in
    # one column - at normal widths it spreads the four groups below across
    # four side-by-side columns (script/src/ui/app/appMainPanel.js:383-396),
    # collapsing to a single stacked column only below its own real 620px
    # threshold (script/src/ui/app/layout.js:111-113, `Layout.prefered =
    # "col3"`). This panel's own reserved height stays the fixed 220px
    # design.md already committed to either way, so a `viewport` (spec 013's
    # scrolling clip box, its first real use in any compiled component tree)
    # replaces the plain panel it used to be: at the wide breakpoint,
    # everything already fits and nothing ever scrolls; at the narrow one,
    # four stacked groups do not fit in 220px, and this is what the user
    # asked for over v1's own real behavior (a hidden tab switch between the
    # four groups, script/src/ui/app/appMainPanel.js:363-376) - scrolling,
    # not tab-switching, is the fallback.
    field: scroll.main.normalMainView.songProperties.songPropertiesDefault
    layout:
      width: fill
      height: fill
    visibleWhen:
      field: song-properties-view.value
      oneOf:
        - ""
    content:
      - name: songPropertiesLayout
        type: panel
        variant: transparent
        layout:
          width: fill
          direction: row
        # Matches v1's own real, single width threshold (see this node's
        # parent's own comment) rather than inventing a new one.
        breakpoints:
          - maxWidth: 619
            layout:
              direction: column
        content:
          # v1's own left-to-right column order (appMainPanel.js:383-396):
          # song/pattern list, the two three-spinbox columns, then logo/
          # tracker + mod-name + instrument list.
          - name: songPatternGroup
            type: panel
            layout:
              width: col1Minus5
            content:
              - songPatternList
          - name: spinBoxGroupA
            type: panel
            variant: transparent
            layout:
              width: col1
              height: 84
              offsetY: 49
              widthOffset: -2
              direction: column
              padding: 0
              gap: 0
            content:
              - name: spinBoxPanelA
                type: panel
                variant: songPropertyInset
                layout:
                  position: absolute
                  left: 0
                  top: -3
                  width: fill
                  widthOffset: 2
                  height: 94
              - name: bpmSpinBox
                type: spinBox
                label: BPM
                variant: songPropertyBpm
                stepperWidth: 20
                stepperDirection: horizontal
                padLength: 4
                layout:
                  width: fill
                  height: 28
                field: song.bpm
                min: 1
                max: 400
                step: 1
                actions:
                  - change: setBPM
              - name: songLengthSpinBox
                type: spinBox
                label: Song length, Song len, Length, Len.
                variant: songPropertySongLength
                stepperWidth: 20
                stepperDirection: horizontal
                padLength: 4
                layout:
                  width: fill
                  height: 28
                field: song-length.value
                min: 1
                max: 200
                step: 1
                actions:
                  - change: setSongLength
              - name: songRepeatSpinBox
                type: spinBox
                label: Song repeat, Song rep, Repeat, Rep.
                variant: songPropertySongRepeat
                stepperWidth: 20
                stepperDirection: horizontal
                padLength: 4
                layout:
                  width: fill
                  height: 28
                field: song-repeat.value
                min: 1
                max: 200
                step: 1
                actions:
                  - change: setSongRepeat
          - name: spinBoxGroupB
            type: panel
            variant: transparent
            layout:
              width: col1
              height: 84
              offsetY: 49
              widthOffset: -2
              direction: column
              padding: 0
              gap: 0
            content:
              - name: spinBoxPanelB
                type: panel
                variant: songPropertyInset
                layout:
                  position: absolute
                  left: 0
                  top: -3
                  width: fill
                  widthOffset: 2
                  height: 94
              - name: patternSpinBox
                type: spinBox
                label: Pattern, Pat.
                variant: songPropertyPattern
                stepperWidth: 20
                stepperDirection: horizontal
                padLength: 4
                layout:
                  width: fill
                  height: 28
                field: current-pattern.value
                min: 0
                max: 100
                step: 1
                actions:
                  - change: setCurrentPatternNumber
              - name: patternLengthSpinBox
                type: spinBox
                label: Pattern length, Pattern len, Pat len, Plen
                variant: songPropertyPatternLength
                stepperWidth: 20
                stepperDirection: horizontal
                padLength: 4
                layout:
                  width: fill
                  height: 28
                field: pattern-length.value
                min: 1
                max: 128
                step: 1
                actions:
                  - change: setPatternLength
              - name: songInstrumentSpinBox
                type: spinBox
                label: Instrument, Instr, Ins.
                variant: songPropertyInstrument
                stepperWidth: 20
                stepperDirection: horizontal
                padLength: 4
                layout:
                  width: fill
                  height: 28
                field: instrument-index.value
                min: 1
                max: 128
                step: 1
                actions:
                  - change: setInstrumentIndex
          - name: instrumentGroup
            type: panel
            variant: transparent
            layout:
              width: fill
              widthOffset: 5
              height: 148
              offsetY: -8
              direction: column
              padding: 0
              gap: 4
            content:
              - name: modNameInput
                type: inputbox
                field: song.title
                placeholder: "(untitled)"
                layout:
                  width: fill
                  height: 20
                actions:
                  - change: setSongTitle
              - name: instrumentList
                type: fileBrowser
                layout:
                  width: fill
                  height: 124
                actions:
                  - change: setInstrumentRow
                  - doubleClick: openInstrumentInSampleEditor
  # V1's banners occupy the first three columns above the three lower
  # property groups. They are siblings of the default viewport so their
  # coordinates are relative to the real 160px AppMainPanel, not to the
  # right-hand instrument column.
  - name: logoBanner
    type: button
    label: ""
    variant: logo
    layout:
      position: absolute
      left: columnMargin
      top: 4
      width: col2Exact
      height: 50
    visibleWhen:
      field: song-properties-view.value
      oneOf:
        - ""
    rule: "highlighted when logo is active"
    actions:
      - click: toggleLogo
  - name: cornerDeco
    type: image
    src: togglecorner
    layout:
      position: absolute
      left: 1
      top: 1
      width: 22
      height: 19
    visibleWhen:
      field: song-properties-view.value
      oneOf:
        - ""
  - name: trackerBanner
    type: image
    src: tracker
    layout:
      position: absolute
      left: col3Left
      top: 4
      width: col1
      height: 50
    visibleWhen:
      field: song-properties-view.value
      oneOf:
        - ""
  - fileOperationsPanel
  - optionsPanel
  - nibblesPanel
