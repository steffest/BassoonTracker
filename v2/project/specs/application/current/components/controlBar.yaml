name: controlBar
type: panel
layout:
  width: fill
  height: fixed
breakpoints:
  - maxWidth: 650
    layout:
      direction: column
      height: 160
content:
  - name: topViewButtons
    type: buttonGroup
    layout:
      direction: row
    items:
      - name: fileOperationsButton
        type: button
        label: File Operations
        rule: highlighted when file operations view is active
        actions:
          - click: toggleFileOperationsView
      - name: optionsButton
        type: button
        label: Options
        rule: highlighted when options view is active
        actions:
          - click: toggleOptionsView
      - name: sampleEditButton
        type: button
        label: Sample Edit
        rule: highlighted when sample edit panel is active
        actions:
          - click: toggleSampleEditPanel
  - type: radioGroup
    items:
      - name: song
        label: Song, S
      - name: pattern
        label: Pattern, P
    actions:
      - change: setPlaybackType
  - type: button
    label: Play
    variant: play
    rule: highlighted when song playback is active
    actions:
      - click: toggleplay
    shortKey: Enter
  - type: button
    label: record
    variant: record
    rule: highlighted when recording is active
    actions:
      - click: toggleRecording
    shortKey: Space
  - type: spinBox
    variant: big
    actions:
      - change: set number of tracks
  - type: panel
    content:
      - type: radioGroup
        label: Mode, M
        variant: buttons
        items:
          - label: mod
          - label: xm
      - type: radioGroup
        label: Display, D
        variant: buttons
        items:
          - label: 4
          - label: 8
          - label: 12
          - label: 16
      - name: patternViewGroup
        type: radioGroup
        variant: buttons
        items:
          - label: "Column view"
          - label: "Row view"
        actions:
          - change: setPatternView
      - type: radioGroup
        variant: buttons
        action:
          - change: setEditorLayout
        items:
          - name: vertical
          - name: horizontal